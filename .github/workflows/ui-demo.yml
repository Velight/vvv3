name: UI screenshots and interaction
on:
  push:
    branches: [frontend-pr2, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
      - name: API and frontend tests
        run: |
          python -m pytest -q
          node --test tests/api.test.mjs tests/webmcp.test.mjs
      - name: Capture live UI
        env:
          API_KEYS_JSON: '{"local-demo":{"role":"editor","user_id":"demo","clients":["*"]}}'
          SEED_DEMO: 'true'
          DATABASE_PATH: /tmp/kapcha-ui-demo.db
        run: |
          mkdir -p ui-capture
          uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 >ui-capture/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && break
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:8000 python tests/check_history_ui.py
          TEST_BASE_URL=http://127.0.0.1:8000 COPILOT_SCREENSHOT=ui-capture/17-copilot.png python tests/check_copilot_ui.py
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={"width":1536,"height":768},device_scale_factor=1,record_video_dir="ui-capture",record_video_size={"width":1536,"height":768})
              page = context.new_page()
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              try:
                  page.goto("http://127.0.0.1:8000/")
                  page.locator("input[name=key]").fill("local-demo")
                  page.get_by_role("button",name="Подключиться").click()
                  page.locator(".client-card").first.wait_for()
                  assert page.locator(".client-card").evaluate_all("(els) => els.map(el=>el.dataset.client)")[:4] == ["krasnodar", "vtb", "mvideo", "s7"]
                  page.wait_for_function("Array.from(document.querySelectorAll('.brand')).every(el=>el.complete && el.naturalWidth>0)")
                  page.wait_for_timeout(600)
                  page.screenshot(path="ui-capture/01-clients.png")
                  page.wait_for_timeout(1200)
                  page.locator('[data-client="krasnodar"]').click()
                  page.locator(".graph .person").first.wait_for()
                  page.wait_for_timeout(700)
                  assert page.locator('.graph-tools').count() == 0
                  assert page.evaluate("getComputedStyle(document.querySelector('.contact-body')).scrollbarWidth === 'none'")
                  page.screenshot(path="ui-capture/02-map.png")
                  page.wait_for_timeout(1000)
                  page.locator(".graph .person").nth(1).click()
                  page.wait_for_timeout(1000)
                  page.evaluate("window.mapShell = document.querySelector('.map-screen'); window.mapPanel = document.querySelector('#assistant-panel'); window.mapGraph = document.querySelector('.graph')")
                  page.get_by_role("button",name="Сделка",exact=True).click()
                  page.wait_for_timeout(250)
                  assert page.evaluate("window.mapShell === document.querySelector('.map-screen') && window.mapPanel === document.querySelector('#assistant-panel') && window.mapGraph === document.querySelector('.graph')")
                  assert page.evaluate("getComputedStyle(document.querySelector('.map-screen')).animationName === 'none'")
                  page.wait_for_timeout(1200)
                  page.screenshot(path="ui-capture/03-deal.png")
                  page.get_by_role("button",name="Клиент",exact=True).click()
                  page.wait_for_timeout(800)
                  page.get_by_role("button",name="Проверить факт").click()
                  page.wait_for_timeout(1000)
                  page.screenshot(path="ui-capture/04-evidence.png")
                  page.get_by_role("button",name="Закрыть").click()
                  page.locator("#chat-input").fill("Кто принимает решения?")
                  page.locator("#chat-form button[type=submit]").click()
                  page.locator(".bubble.assistant").last.wait_for()
                  page.wait_for_timeout(2000)
                  page.screenshot(path="ui-capture/05-assistant.png")
                  page.wait_for_timeout(1000)
                  page.get_by_role("button",name="Предложить правку").click()
                  page.locator("textarea[name=communication_notes]").fill("Тестовая правка интерфейса")
                  page.get_by_role("button",name="Сохранить").click()
                  page.locator("dialog").wait_for(state="hidden")
                  page.get_by_role("button",name="Предыдущая версия").click()
                  page.locator(".timeline-label.historical").wait_for()
                  page.screenshot(path="ui-capture/06-history.png")
                  page.get_by_role("button",name="Следующая версия").click()
                  page.locator(".timeline-label").filter(has_text="Текущая версия").wait_for()
                  page.get_by_role("button", name="Источники", exact=True).click()
                  page.locator(".mg-catalog-card").first.wait_for()
                  assert page.locator(".mg-catalog-card").count() == 4
                  page.screenshot(path="ui-capture/11-sources.png")
                  for category in ("crm", "mail", "calendar", "docs"):
                      page.locator('[data-action="mg-open:'+category+'"]').click()
                      page.locator(".mg-detail-card").first.wait_for()
                      page.wait_for_function("!document.querySelector('[data-action=mg-refresh]').disabled")
                      page.screenshot(path="ui-capture/12-"+category+".png")
                      assert page.locator(".mg-detail-card").count() == 2
                      if category == "crm":
                          switch = page.get_by_role("switch", name="Найти контакт")
                          switch.click()
                          assert switch.get_attribute("aria-checked") == "false"
                          switch.click()
                          assert switch.get_attribute("aria-checked") == "true"
                          page.get_by_role("button", name="Контакты Имена", exact=False).click()
                          page.locator("#mg-record-search").wait_for()
                          page.get_by_role("button",name="Закрыть").click()
                      page.get_by_role("button",name="К источникам").click()
                  page.get_by_role("button",name="Настройки",exact=True).click()
                  page.locator(".mg-settings-card").first.wait_for()
                  switch = page.get_by_role("switch",name="Показывать только проверенные связи")
                  switch.click()
                  assert switch.get_attribute("aria-checked") == "true"
                  switch.click()
                  page.screenshot(path="ui-capture/16-settings.png")
                  if errors:
                      raise AssertionError(errors)
              finally:
                  context.close()
                  browser.close()
              browser = p.chromium.launch()
              context = browser.new_context(viewport={"width":390,"height":844},is_mobile=True,has_touch=True,device_scale_factor=1)
              page = context.new_page()
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              try:
                  page.goto("http://127.0.0.1:8000/")
                  page.locator("input[name=key]").fill("local-demo")
                  page.get_by_role("button",name="Подключиться").click()
                  page.locator(".client-card").first.wait_for()
                  assert page.evaluate("document.documentElement.scrollWidth === innerWidth")
                  page.screenshot(path="ui-capture/07-mobile-clients.png")
                  page.locator('[data-client="krasnodar"]').tap()
                  page.locator(".graph .person").first.wait_for()
                  assert not page.locator("#contact-panel").is_visible()
                  assert page.evaluate("document.documentElement.scrollWidth === innerWidth")
                  page.screenshot(path="ui-capture/08-mobile-map.png")
                  page.get_by_role("button",name="Список контактов").tap()
                  page.locator(".mobile-person-choice").first.tap()
                  assert page.locator("#contact-panel").is_visible()
                  page.screenshot(path="ui-capture/09-mobile-contact.png")
                  page.locator("#contact-panel .panel-heading button").tap()
                  assert not page.locator("#contact-panel").is_visible()
                  page.locator('[data-action="mobile-assistant"]').tap()
                  page.locator("#chat-input").fill("Кто принимает решения?")
                  page.locator("#chat-form button[type=submit]").tap()
                  page.locator(".bubble.assistant").last.wait_for()
                  page.screenshot(path="ui-capture/10-mobile-assistant.png")
                  page.locator("#assistant-panel .panel-heading button").tap()
                  page.get_by_role("button",name="Предыдущая версия").tap()
                  page.locator(".timeline-label.historical").wait_for()
                  assert not errors, errors
              finally:
                  context.close()
                  browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kapcha-ui-capture
          path: ui-capture/
